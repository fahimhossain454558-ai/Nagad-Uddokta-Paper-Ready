*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Hind Siliguri','Noto Sans Bengali',Arial,sans-serif;color:#111}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px}

.cb{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.6px solid #222;background:#fff;padding:0;margin:0;cursor:pointer;z-index:4}
.tk{pointer-events:none;z-index:6}

.par{font-size:17px;line-height:25px;white-space:nowrap;font-weight:500}

function useFont(buf,show){var ff=new FontFace('UserBn',buf);ff.load().then(function(){document.fonts.add(ff);if(show)msg('ফন্ট বসানো হয়েছে ✓')}).catch(function(){msg('ফন্ট লোড হয়নি — .otf বা .ttf ফাইল দিন')})}
function pick(acc,cb){var i=document.createElement('input');i.type='file';i.accept=acc;i.style.display='none';i.onchange=function(){if(i.files[0])cb(i.files[0]);i.remove()};document.body.appendChild(i);i.click()}
function setFont(){pick('',function(f){f.arrayBuffer().then(function(b){sv('font',b.slice(0));useFont(b,true)})})}
ld('font',useFont);

/* free typing */
var FS=20,SEL=null,DLV=0,LAST=null;
function select(d){if(d)LAST=d;if(SEL&&SEL!==d)SEL.classList.remove('sel');SEL=d;if(d)d.classList.add('sel')}
function msg(t){var m=document.getElementById('msg');m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(function(){m.textContent=''},3500)}
function applyLv(d,l){l=Math.max(-8,Math.min(14,l));d.dataset.lv=l;d.style.webkitTextStroke=l>0?(l*.2)+'px currentColor':'';var g=17+(-l)*22;d.style.color=l<0?'rgb('+g+','+g+','+g+')':''}
function mkFree(x,y){var d=document.createElement('div');d.className='free';d.contentEditable='true';d.style.left=x+'px';d.style.top=(y-14)+'px';d.style.fontSize=FS+'px';applyLv(d,DLV);P.appendChild(d);d.addEventListener('focus',function(){if(d.textContent.trim())select(d)});d.addEventListener('input',function(){select(d)});d.addEventListener('blur',function(){if(!d.textContent.trim()){if(SEL===d)SEL=null;d.remove()}});d.focus();return d}
P.addEventListener('click',function(e){var t=e.target;if(t.tagName=='INPUT')return;if(t.closest&&t.closest('.fld'))return;if(t.classList.contains('free'))return;var r=P.getBoundingClientRect(),k=r.width/1271;mkFree((e.clientX-r.left)/k,(e.clientY-r.top)/k)});
function fs(d){if(SEL&&document.body.contains(SEL)){var cur=parseFloat(getComputedStyle(SEL).fontSize)||FS;SEL.style.fontSize=Math.max(8,Math.min(150,cur+d))+'px'}else{msg('আগে যে ঘরের সাইজ বদলাবেন সেই ঘরে ক্লিক করুন')}}
function mv(dx,dy){if(!SEL){msg('আগে যে লেখাটি সরাবেন তার ওপর ক্লিক করে সিলেক্ট করুন');return}
 if(SEL.classList.contains('fld')){var pl=parseFloat(SEL.dataset.ox)||0,pt=parseFloat(SEL.dataset.oy)||0;pl+=dx;pt+=dy;SEL.dataset.ox=pl;SEL.dataset.oy=pt;
  var base=SEL.classList.contains('cell')?6:8;
  SEL.style.paddingLeft=Math.max(0,base+pl)+'px';SEL.style.paddingRight=Math.max(0,base-pl)+'px';SEL.style.paddingTop=Math.max(0,pt)+'px';SEL.style.paddingBottom=Math.max(0,-pt)+'px';return}
 var l=parseFloat(SEL.style.left)||0,t=parseFloat(SEL.style.top)||0;SEL.style.left=Math.max(0,Math.min(1251,l+dx))+'px';SEL.style.top=Math.max(-10,Math.min(1778,t+dy))+'px'}
function lv(dl){if(LAST&&document.body.contains(LAST)){applyLv(LAST,(+LAST.dataset.lv||0)+dl)}else{DLV=Math.max(-8,Math.min(14,DLV+dl));msg('নতুন লেখার জন্য '+(DLV>0?'বোল্ড':DLV<0?'হালকা':'সাধারণ')+' সেট হলো')}}
document.addEventListener('focusin',function(e){var t=e.target;if(!t.classList)return;if(t.classList.contains('fld')){select(t);LAST=t;return}if(t.classList.contains('free')&&t.textContent.trim())LAST=t});
document.addEventListener('keydown',function(e){var t=e.target;if(t.classList&&t.classList.contains('fld')&&e.key==='Enter')e.preventDefault()});
document.addEventListener('paste',function(e){var t=e.target;if(t.classList&&t.classList.contains('fld')){e.preventDefault();var s2=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/[\r\n]+/g,' ');document.execCommand('insertText',false,s2)}});
document.addEventListener('input',function(e){var t=e.target;if(t.classList&&t.classList.contains('fld')&&t.textContent===''&&t.firstChild)t.innerHTML=''});
function hold(btn,fn){var t,iv;function stop(){clearTimeout(t);clearInterval(iv)}btn.addEventListener('mousedown',function(e){e.preventDefault()});btn.addEventListener('contextmenu',function(e){e.preventDefault()});btn.addEventListener('pointerdown',function(e){e.preventDefault();stop();fn();t=setTimeout(function(){iv=setInterval(fn,45)},350)});['pointerup','pointerleave','pointercancel'].forEach(function(n){btn.addEventListener(n,stop)})}
document.querySelectorAll('[data-fs]').forEach(function(b){hold(b,function(){fs(+b.dataset.fs)})});
document.querySelectorAll('[data-lv]').forEach(function(b){hold(b,function(){lv(+b.dataset.lv)})});
document.querySelectorAll('[data-mv]').forEach(function(b){var v=b.dataset.mv.split(',');hold(b,function(){mv(+v[0],+v[1])})});
/* clearer Bengali digits */
document.querySelectorAll('.t').forEach(function(e){e.innerHTML=e.innerHTML.replace(/[০-৯]+/g,'<span class="bd">$&</span>')});

/* কলমে আঁকা টিক */
var TK=0;
function tick(i){
 if(i._tk){i._tk.remove();i._tk=null}
 if(!i.checked)return;
 var r=function(a,b){return a+Math.random()*(b-a)};
 var x=parseFloat(i.style.left),y=parseFloat(i.style.top),id='tkf'+(++TK);
 var sx=10+r(-1.5,1.5),sy=29+r(-1.5,1.5),bx=19+r(-1.5,1.5),by=41+r(-1,1.5),ex=47+r(-3,2),ey=5+r(-2,3);
 var d='M'+sx.toFixed(1)+' '+sy.toFixed(1)+' C'+(sx+3).toFixed(1)+' '+(sy+3.5).toFixed(1)+' '+(bx-3).toFixed(1)+' '+(by-4).toFixed(1)+' '+bx.toFixed(1)+' '+by.toFixed(1)+' C'+(bx+4).toFixed(1)+' '+(by-9).toFixed(1)+' '+(ex-14).toFixed(1)+' '+(ey+13).toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1);
 var w=r(2.4,3.1).toFixed(2);
 var h='<svg width="52" height="52" viewBox="0 0 52 52" style="overflow:visible;transform:rotate('+r(-4,4).toFixed(1)+'deg)"><defs><filter id="'+id+'" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="'+Math.floor(r(1,99))+'" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></defs><g filter="url(#'+id+')"><path d="'+d+'" fill="none" stroke="#10193a" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="#1b2a63" stroke-width="'+(w*.45).toFixed(2)+'" stroke-linecap="round" stroke-linejoin="round" opacity=".75" transform="translate(.5 -.4)"/></g></svg>';
 i._tk=E('tk','left:'+(x-8)+'px;top:'+(y-22)+'px;width:52px;height:52px',h)}
function clearAll(){document.querySelectorAll('.tk').forEach(function(e){e.remove()});document.querySelectorAll('input[type=checkbox]').forEach(function(i){i._tk=null;i.checked=false});document.querySelectorAll('.free').forEach(function(e){e.remove()});document.querySelectorAll('.fld').forEach(function(i){i.textContent=''});SEL=null;LAST=null}
function fit(){var k=Math.min(1,(window.innerWidth-12)/1271),s2=document.getElementById('stage');P.style.transform='scale('+k+')';s2.style.width=(1271*k)+'px';s2.style.height=(1798*k)+'px'}
window.addEventListener('resize',fit);fit();fitLines();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLines);window.addEventListener('load',fitLines);
</script>
