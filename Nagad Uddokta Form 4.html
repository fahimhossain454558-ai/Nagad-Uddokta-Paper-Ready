ৃক ধার্যকৃত কমিশন পাবেন। কমিশনের উপর সরকারি নীতি অনুযায়ী ট্যাক্স (TAX) প্রযোজ্য হবে। এছাড়াও ব্যবসার কাজে উদ্যোক্তা ব্যক্তিগত একাউন্ট ব্যবহার করবেন না। এর ব্যতিক্রম ঘটলে যথাযথ প্রক্রিয়া মেনে, নগদ উক্ত উদ্যোক্তার একাউন্ট স্থগিত বা বাতিল করা সহ, উদ্যোক্তার বিরুদ্ধে প্রচলিত আইন অনুযায়ী যেকোন শাস্তিমূলক বা আইনগত ব্যবস্থা গ্রহণ করতে পারবে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে। নগদ তদন্ত চলাকালে উদ্যোক্তার কার্যক্রম সাময়িকভাবে স্থগিত রাখার অধিকার সংরক্ষণ করে।", 0], ["৮.", "একজন উদ্যোক্তা নগদ গ্রাহকের সকল তথ্য, যেমন- গ্রাহকের নাম, ফোন নাম্বার, জন্ম তারিখ, জাতীয় পরিচয়পত্রের নাম্বার এবং অন্যান্য গুরুত্বপূর্ণ তথ্য সর্বদা গোপন রাখবেন। নগদ-এর লিখিত পূর্বানুমতি ব্যতীত, এ সকল তথ্য এবং গ্রাহকের একাউন্ট খোলার ফরমের কোনো কপি উদ্যোক্তা কারো কাছে প্রকাশ করবেন না। এর ব্যতিক্রম ঘটলে নগদ পরবর্তী কোনো প্রকার অবহিতকরণ ছাড়াই উদ্যোক্তার একাউন্ট স্থগিত করা বা বাতিল করা সহ উদ্যোক্তার বিরুদ্ধে যেকোন প্রকার শাস্তিমূলক বা আইনগত ব্যবস্থা গ্রহণ করতে পারে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে।", 0], ["৯.", "সন্দেহজনক লেনদেন সম্পর্কে উদ্যোক্তা সবসময় সতর্ক থাকবেন এবং নগদ সার্ভিস-এর মাধ্যমে সন্দেহজনক কোনো লেনদেন সম্পর্কে জানার সাথে সাথে তা নগদ-কে জানাতে বাধ্য থাকবেন।", 0], ["১০.", "উদ্যোক্তা নগদ কর্তৃক প্রেরিত বিভিন্ন ট্রেডলেটারসমূহ সঠিকভাবে পড়বেন, বুঝবেন, মেনে চলবেন এবং তার ব্যবসা প্রতিষ্ঠানে এর যথাযথ প্রয়োগ, সংরক্ষণ ও রক্ষণাবেক্ষণ করবেন। উদ্যোক্তা বিভিন্ন সময়ে নগদ কর্তৃক এসএমএস কিংবা অন্য যেকোন মাধ্যমে প্রেরিত নির্দেশনাসমূহ মেনে চলতে বাধ্য থাকবেন। তবে এই নির্দেশনাসমূহে যদি উদ্যোক্তাকে কোনো লেনদেন করতে কিংবা নির্দিষ্ট সংখ্যা চাপতে অথবা পিন (PIN) নাম্বার বা নগদ একাউন্ট সংক্রান্ত তথ্য প্রকাশ করতে বলা হয়, তবে উদ্যোক্তা অবশ্যই ১৬১৬৭ নাম্বারে কিংবা নগদ-এর কোনো কর্মচারীকে ফোন কল করে যাচাই করা ব্যতীত, সে নির্দেশনা অনুযায়ী কাজ করবেন না।", 0], ["১১.", "উদ্যোক্তার কার্ড (স্ট্রাচ কার্ড, ভার্চুয়াল কার্ড ইত্যাদি), সিম কার্ড সংরক্ষণ ও সিম কার্ড প্রতিস্থাপন সংক্রান্ত দায়িত্ব উদ্যোক্তাকেই নিতে হবে। এ সংক্রান্ত কোনো দায়-দায়িত্ব নগদ বহন করবে না।", 0], ["১২.", "উদ্যোক্তাই তার উদ্যোক্তা একাউন্টটি রক্ষণাবেক্ষণ ও এই একাউন্ট ব্যবহার করে ব্যবসা পরিচালনা করার জন্য দায়িত্বপ্রাপ্ত থাকবেন। শুধুমাত্র উদ্যোক্তাই তার নিজের একাউন্ট ব্যবহার করতে পারবেন। এর ব্যতিক্রম ঘটলে নগদ কোনো প্রকার অবহিতকরণ ছাড়াই উদ্যোক্তার একাউন্ট স্থগিত বা বাতিল করা সহ, উদ্যোক্তার বিরুদ্ধে যেকোন প্রকার শাস্তিমূলক বা আইনগত ব্যবস্থা নিতে পারবে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে।", 0], ["১৩.", "উদ্যোক্তা তার নগদ একাউন্টের পিন (PIN) নাম্বারের সর্বোচ্চ সুরক্ষা নিশ্চিত করার জন্য এককভাবে দায়ী থাকবেন। উদ্যোক্তার অবহেলাজনিত কারণে এবং/অথবা উদ্যোক্তা কর্তৃক পিন (PIN) নাম্বারের গোপনীয়তার শর্তাবলি ভঙ্গ করার কারণে এবং/অথবা পিন (PIN) নাম্বারের কোনো প্রকার অপব্যবহারের ফলে কোনো প্রতারণা এবং/অথবা অন্য কোনোপ্রকার ক্ষয়ক্ষতি হলে নগদ কোনোভাবেই এর দায় বহন করবে না। পিন (PIN) নাম্বার অপব্যবহারের আশঙ্কা দেখা দিলে তা সাথে সাথে নগদ-এর টেরিটরি ম্যানেজারকে এবং পরবর্তীতে নগদ হেল্পলাইন ১৬১৬৭-এ ফোন কল করে জানাতে হবে এবং উদ্যোক্তা একাউন্টটি বন্ধ করতে হবে। তারপর তা মোবাইল ফোন সেবাদাতা প্রতিষ্ঠানকে তাৎক্ষণিকভাবে জানিয়ে সিম ব্লক করতে হবে। এই ধরনের একাউন্ট ব্লক করার পূর্বে সংঘটিত কোনো ক্ষয়ক্ষতির জন্য উদ্যোক্তা নিজেই এককভাবে দায়ী থাকবেন।", 0], ["১৪.", "গ্রাহক যদি উদ্যোক্তার অবহেলা অথবা অনভিজ্ঞতার কারণে কোনো ক্ষতি বা লোকসানের সম্মুখীন হন, সেক্ষেত্রে কেবলমাত্র উদ্যোক্তাই এককভাবে গ্রাহকের ক্ষতিপূরণে বাধ্য থাকবেন। যদি উদ্যোক্তা উক্ত ক্ষতিপূরণ প্রদান করতে ব্যর্থ হন, তবে যথাযথ তদন্তের পর নগদ ঐ উদ্যোক্তার বিরুদ্ধে যেকোন প্রকার শাস্তিমূলক বা আইনগত ব্যবস্থা নিতে পারবে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে। তদন্ত চলাকালীন নগদ উদ্যোক্তার কার্যক্রম সাময়িকভাবে স্থগিত করে রাখার অধিকার সংরক্ষণ করে।", 0], ["১৫.", "উদ্যোক্তা দৈনন্দিন ব্যবসায়িক কাজের সময়ে নগদ কর্তৃক নির্দেশিত মান অনুযায়ী গ্রাহকদের প্রয়োজনীয় গ্রাহক সেবা প্রদান করবেন। যথাযথ আন্তরিকতা ও সাবধানতার সাথে উদ্যোক্তা এই গ্রাহক সেবা প্রদান করবেন। দৈনিক ব্যবসায়িক কর্মঘণ্টার বিষয়ে নগদ-এর নীতি অনুযায়ী সময়ে সময়ে উদ্যোক্তাকে অবগত করা হবে।", 0], ["১৬.", "যদি কোনো উদ্যোক্তা এই ‘উদ্যোক্তা একাউন্ট ওপেনিং শর্তাবলি’ লঙ্ঘন করেন অথবা বিশ্বাস ভঙ্গ করেন অথবা প্রতারণা করার চেষ্টা করেন, অথবা নগদ-নির্ধারিত কোনো মান ও লক্ষ্য পূরণে ব্যর্থ হন- এসব ক্ষেত্রে অথবা নগদ প্রয়োজন মনে করে- এমন অন্য কোনো ক্ষেত্রে, নগদ উদ্যোক্তার সকল কার্যাবলি স্থগিত করা, বাতিল করা, বন্ধ করা অথবা নগদ-এর বিবেচনায় সঠিক অন্য যেকোন ব্যবস্থা গ্রহণ করা সহ যেকোন প্রকার শাস্তিমূলক বা আইনগত ব্যবস্থা গ্রহণ করার অধিকার রাখে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে।", 0], ["১৭.", "উদ্যোক্তা কর্তৃক সম্পাদিত প্রতিটি লেনদেনের জন্য, লেনদেনের সময় উদ্যোক্তা প্রদত্ত কোনো ভুল নির্দেশনার জন্য এবং কোনো প্রকার প্রলোভন বা প্রতারণামূলক কাজের শিকার হয়ে, উদ্যোক্তা কোনো প্রকার অর্থ লেনদেন করার ক্ষেত্রে একমাত্র উদ্যোক্তাই এককভাবে দায়ী থাকবেন। নগদ কোনো ক্ষেত্রেই প্রাপকের নগদ একাউন্ট থেকে লেনদেনকৃত অর্থ ফেরত প্রদানের দায়িত্ব পালন করবে না।", 0], ["১৮.", "একজন নগদ উদ্যোক্তা কর্তৃক তৃতীয় ব্যক্তি বা ব্যাংক হতে নেয়া যেকোন ব্যক্তিগত লোন বা ঋণ, দেনা, বা দায় একজন উদ্যোক্তার ব্যক্তিগত বিষয়, এক্ষেত্রে নগদ কোনো প্রকার দায়-দায়িত্ব বহন করবে না।", 0], ["১৯.", "নগদ সেবা সংক্রান্ত কোনো বিষয়ে উদ্যোক্তা অসন্তুষ্ট থাকলে তিনি নগদ-এর নিকট ১০ কর্মদিবসের মধ্যে লিখিত অভিযোগ দাখিল করতে পারবেন। এক্ষেত্রে নগদ উদ্যোক্তার কাছ থেকে প্রাপ্ত অভিযোগ কিংবা উদ্যোক্তার লেনদেন সম্পর্কিত কোনো সমস্যার সমাধানের জন্য তা নগদ-এর সংশ্লিষ্ট টিমের কাছে পাঠাতে পারবে। নগদ-এর সংশ্লিষ্ট টিম সুষ্ঠু তদন্তের জন্য প্রয়োজনীয় সকল ব্যবস্থা গ্রহণ করবে এবং উদ্যোক্তাসহ সংশ্লিষ্ট সকল পক্ষকে শুনানির যথোপযুক্ত সুযোগ প্রদান করবে। প্রয়োজনে উদ্যোক্তাকে নগদ-এর হেড অফিসে ডেকে পাঠানো, উদ্যোক্তার একাউন্ট স্থগিত করা, বাতিল করা, বন্ধ করা এবং/অথবা নিষ্পত্তি করা, নগদ-এর বিবেচনায় অন্য যেকোন ব্যবস্থা গ্রহণ করা সহ যেকোন প্রকার শাস্তিমূলক বা আইনগত ব্যবস্থা গ্রহণ করার অধিকার নগদ-এর সংশ্লিষ্ট তদন্ত টিম সংরক্ষণ করে। নগদ যথাযথ আইন শৃঙ্খলা রক্ষাকারী বাহিনীর উপর এ সমস্ত বিষয় অর্পণ করতে পারবে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে।", 0], ["২০.", "নগদ সিস্টেমে সংরক্ষিত লেনদেন সংক্রান্ত যাবতীয় তথ্য যেকোন দ্বন্দ্ব নিরসনে চূড়ান্ত প্রমাণ হিসেবে বিবেচ্য হবে।", 0], ["২১.", "নগদ সরাসরি অথবা ফোন কল অথবা ই-মেইল অথবা অন্য কোনোভাবে অডিও/ভিডিও/লিখিত জরিপ, প্রশ্নোত্তর এবং সাক্ষাৎকারে অংশগ্রহণের জন্য উদ্যোক্তার সঙ্গে যোগাযোগ করতে পারবে। উক্ত বিষয়বস্তুতে নগদ-এর সর্বপ্রকার অধিকার থাকবে এবং নগদ ভবিষ্যতে উদ্যোক্তার কোনো প্রকারের অনুমতি গ্রহণ ছাড়াই উক্ত বিষয়বস্তু অভ্যন্তরীণ কিংবা বাহ্যিক কোনো প্রয়োজনে প্রকাশ কিংবা সম্প্রচার করার ক্ষেত্রে একক সিদ্ধান্ত গ্রহণ করতে পারবে।", 0], ["২২.", "নগদ তার নির্দেশিত নিয়ম-নীতি অনুসারে যেকোন সময় উদ্যোক্তার কাছে প্রচার সংক্রান্ত স্বয়ংক্রিয় IVR (Interactive Voice Response) ও পূর্বে রেকর্ডকৃত OBD (Outbound Dialler), ফোন কল অথবা এসএমএস পাঠানোর অধিকার সংরক্ষণ করে। যদি এই চুক্তি ও একাউন্ট পরিচালনা বিষয়ক বর্তমান নিয়ম ও শর্তাবলির ভেতরে কোনো দ্বন্দ্ব বা অসঙ্গতি দেখা দেয়, তবে এই চুক্তি বাতিল করা হবে।", 0], ["২৩.", "উদ্যোক্তা তার ব্যবসার মালিকানা নগদ-এর পূর্বানুমতি ব্যতীত পরিবর্তন করতে পারবেন না। নগদ-এর পূর্বানুমতি ব্যতীত উদ্যোক্তা মালিকানা হস্তান্তর করলে, নগদ এ বিষয়ে অবগত হওয়ার সাথে সাথে ঐ উদ্যোক্তার কার্যক্রম স্থগিত করার ক্ষমতা সংরক্ষণ করে।", 0], ["২৪.", "উদ্যোক্তাকে পূর্বে জানানো অথবা বিজ্ঞাপনজারি ব্যতিরেকে যেকোন সময়ে নগদ প্রয়োজন অনুসারে বর্তমান নিয়মাবলি সংশোধন, উন্নয়ন, পরিবর্তন ও পরিবর্ধন করার ক্ষমতা সংরক্ষণ করে।", 0], ["২৫.", "একাউন্টে জমাকৃত টাকা বা এর মাধ্যমে লেনদেনকৃত টাকার উপর যেকোন ধরনের ইন্টারেস্ট প্রদান করা বা না করার যাবতীয় অধিকার নগদ সংরক্ষণ করে।", 0], ["২৬.", "কোনো উদ্যোক্তার মৃত্যু হলে সংশ্লিষ্ট ডিস্ট্রিবিউটর তা তাৎক্ষণিকভাবে নগদ কর্তৃপক্ষকে জানাবেন। উপযুক্ত তথ্য প্রমাণের ভিত্তিতে পরবর্তীতে যথাযথ কর্তৃপক্ষের নির্দেশনা অনুযায়ী সঠিক ব্যবস্থা নেয়া হবে।", 0], ["২৭.", "নগদ কর্তৃক বিভিন্ন সময়ে ইস্যুকৃত বা জারিকৃত সকল নির্দেশনাসমূহ উদ্যোক্তা সবসময় মেনে চলতে বাধ্য থাকবেন। এর ব্যতিক্রম ঘটলে যথাযথ তদন্তের পর, নগদ উক্ত উদ্যোক্তার একাউন্ট স্থগিত করা বা বাতিল করা সহ উদ্যোক্তার বিরুদ্ধে প্রচলিত আইন অনুযায়ী যেকোন শাস্তিমূলক বা আইনগত ব্যবস্থা নিতে পারবে। এক্ষেত্রে নগদ-এর সিদ্ধান্তই চূড়ান্ত বলে গণ্য হবে। তদন্ত চলাকালীন নগদ, উদ্যোক্তার অপারেশন সাময়িকভাবে স্থগিত করে রাখার অধিকার সংরক্ষণ করে।", 0], ["২৮.", "সর্বোপরি, এই সেবা বাংলাদেশ ব্যাংক এবং ডা function fitTerms(){
  var items=TD.querySelectorAll('.it'),n=items.length,last=items[n-1];
  function setGap(g){for(var j=0;j<n-1;j++)items[j].style.marginBottom=g+'px'}

  setGap(GAP);
  var lo=9,hi=30;
  for(var i=0;i<16;i++){
    var m=(lo+hi)/2;
    TD.style.fontSize=m+'px';
    if(used()<=TD.clientHeight-END)lo=m;else hi=m;
  }
  TD.style.fontSize=lo+'px';
  /* বাকি ফাঁকটুকু পয়েন্টগুলোর মাঝে সমানভাবে ভাগ করে দিই */
  var slack=TD.clientHeight-END-used();
  if(slack>0)setGap(GAP+Math.min(slack/(n-1),14));
}

/* custom font, saved in this browser */
function db(cb){var r=indexedDB.open('nf',1);r.onupgradeneeded=function(){r.result.createObjectStore('s')};r.onsuccess=function(){cb(r.result)}}
function sv(k,v){try{db(function(d){d.transaction('s','readwrite').objectStore('s').put(v,k)})}catch(e){}}
function ld(k,f){try{db(function(d){var q=d.transaction('s').objectStore('s').get(k);q.onsuccess=function(){if(q.result)f(q.result)}})}catch(e){}}
function useFont(buf,show){var ff=new FontFace('UserBn',buf);ff.load().then(function(){document.fonts.add(ff);if(show)msg('ফন্ট বসানো হয়েছে ✓')}).catch(function(){msg('ফন্ট লোড হয়নি — .otf বা .ttf ফাইল দিন')})}
function pick(acc,cb){var i=document.createElement('input');i.type='file';i.accept=acc;i.style.display='none';i.onchange=function(){if(i.files[0])cb(i.files[0]);i.remove()};document.body.appendChild(i);i.click()}
function setFont(){pick('',function(f){f.arrayBuffer().then(function(b){sv('font',b.slice(0));useFont(b,true)})})}
