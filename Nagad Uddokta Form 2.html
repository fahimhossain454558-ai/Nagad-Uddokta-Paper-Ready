function fitLabels(){
 var inputs=[].slice.call(P.querySelectorAll('.fld.f'));
 [].slice.call(P.querySelectorAll('.t')).forEach(function(t){
  var y=parseFloat(t.style.top),x=parseFloat(t.style.left),fz=parseFloat(t.style.fontSize);
  if(!(y>570&&y<1500)||fz<12||t.style.transform.indexOf('translate(-50%')>=0)return;
  var best=null;inputs.forEach(function(i){var l=parseFloat(i.style.left),tp=parseFloat(i.style.top),h=parseFloat(i.style.height);
   if(l>x&&Math.abs(tp+h/2-y)<22&&(best===null||l<best))best=l});

  var slot=best-8-x,w=t.offsetWidth;
  if(w>slot){t.style.transform='translateY(-50%) scaleX('+Math.max(.7,slot/w).toFixed(4)+')'}
  else{var n=(t.textContent.match(/ /g)||[]).length;if(n){t.style.wordSpacing=Math.min(5,(slot-w)/n)+'px'}}
 })}
